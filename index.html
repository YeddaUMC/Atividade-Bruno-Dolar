<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Atualiza a página a cada 10 segundos -->
    <meta http-equiv="refresh" content="10">

    <title>Cotação do Dólar</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="py-4">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
                <div>
                    <h1 class="fw-bold mb-1">Cotação do Dólar</h1>
                    <p class="mb-0">Acompanhe o valor do dólar em relação ao real.</p>
                </div>

                <span class="badge rounded-pill text-bg-light px-3 py-2">
                    USD / BRL
                </span>
            </div>
        </div>
    </header>

    <main class="container my-5">

        <div class="cotacao-principal shadow rounded-4 p-4 p-md-5">

            <div class="row align-items-center mb-4">
                <div class="col-md-8">
                    <p class="text-secondary mb-1">Valor atual do dólar</p>

                    <h2 id="valorAtual" class="display-4 fw-bold">
                        Carregando...
                    </h2>
                </div>

                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <span class="badge status">
                        Cotação USD/BRL
                    </span>
                </div>
            </div>

            <hr>

            <div class="row g-3 mt-2">

                <div class="col-md-6">
                    <div class="card border-0 h-100 card-valor">
                        <div class="card-body">
                            <p class="text-secondary mb-2">
                                Maior valor do dia
                            </p>

                            <h3 id="maiorValor" class="fw-bold mb-0">
                                --
                            </h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card border-0 h-100 card-valor">
                        <div class="card-body">
                            <p class="text-secondary mb-2">
                                Menor valor do dia
                            </p>

                            <h3 id="menorValor" class="fw-bold mb-0">
                                --
                            </h3>
                        </div>
                    </div>
                </div>

            </div>

            <div id="erro" class="alert alert-danger mt-4 d-none" role="alert">
                Não foi possível carregar a cotação no momento.
            </div>

            <div class="mt-4 text-secondary small">
                <span>Última atualização: </span>
                <span id="ultimaAtualizacao">--</span>
            </div>

        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">
            Yedda Maria de Faria - 11231102049 - UMC
        </p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
